name: Build roothide deb
on:
  push:
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine version change
        id: version
        run: python3 ci/version_policy.py --report dist/version-policy.json --github-output "$GITHUB_OUTPUT"
      - name: Install Linux compiler and packaging tools
        run: bash ci/install_linux_deps.sh 2>&1 | tee dist/linux-setup.log
      - name: Cache pinned public dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .deps/theos
            .deps/sdk-source
            .deps/toolchain.sha256
            vendor/frida-gum/arm64
            vendor/frida-gum/arm64e
          key: simharbor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/dependencies.json', 'vendor/frida-gum/PROVENANCE.json') }}
      - name: Bootstrap pinned Theos, SDK and Gum
        run: python3 ci/bootstrap.py 2>&1 | tee dist/bootstrap.log
      - name: Validate source and run tests
        run: |
          set -euo pipefail
          python3 scripts/sync_version.py
          python3 scripts/build_docs.py
          python3 scripts/check_public_tree.py
          python3 tests/test_ci_policy.py
          python3 tests/check_offline.py 2>&1 | tee dist/offline-checks.log
      - name: Build deb
        run: bash build.sh 2>&1 | tee dist/build.log
      - name: Verify package and collect artifacts
        run: python3 ci/collect_artifacts.py
      # No branch/path filter or cancellation group: every push gets its own run.
      # Failed builds still upload diagnostics; only successful builds contain a deb.
      - name: Upload artifacts for every push
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SIMHarbor-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SIMHarbor-${{ github.sha }}-${{ github.run_attempt }}
          path: dist
      - name: Publish only a newly changed version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          printf 'SIMHarbor %s\n\nCommit: %s\n\nLinux-built roothide package. Install the app and CommCenter extension together from this deb.\n' "$VERSION" "$COMMIT" > RELEASE_NOTES.md
          gh release create "$tag" "SIMHarbor_${VERSION}_roothide.deb" SHA256SUMS build-info.json \
            --repo "$GH_REPO" --target "$COMMIT" --title "SIMHarbor $VERSION" --notes-file RELEASE_NOTES.md
